# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# GitHub's own runners: ubuntu-latest (the build dependencies by apt-get) and windows-latest.
jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator> (default)
      # 3. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator> (alternative)
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [clang, gcc, cl]  # Clang first as it's now the default
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            cmake_extra: -DOBS_VST3=ON  # the plugins also as VST3 (clap-wrapper fetches the VST3 SDK)
            runner: windows-latest
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            runner: ubuntu-latest
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            runner: ubuntu-latest
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Show compiler information
      shell: bash
      run: |
        echo "OS: ${{ matrix.os }}"
        echo "C Compiler: ${{ matrix.c_compiler }}"
        echo "C++ Compiler: ${{ matrix.cpp_compiler }}"
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          echo "Available compilers:"
          which gcc g++ clang clang++ || true
          echo "Clang version:"
          clang++ --version || true
          echo "GCC version:"
          g++ --version || true
        fi

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libpulse-dev pkg-config libc++-dev libc++abi-dev libwayland-dev libxkbcommon-dev libegl-dev wayland-protocols

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build-${{ matrix.c_compiler }}" >> "$GITHUB_OUTPUT"  # one per compiler

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.cmake_extra }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Validate Build
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      shell: bash
      run: |
        echo "Listing built executables:"
        ls -la bin/ || ls -la ${{ matrix.build_type }}/bin/ || echo "Build directory structure varies by platform"

        echo "Testing wave generation (Linux only, works without audio hardware):"
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          timeout 10s ./bin/test_wave_print || echo "Wave test completed or timed out (expected)"
          echo "Testing WAV file generation:"
          timeout 15s ./bin/simple_wav_example || echo "WAV generation test completed or timed out (expected)"
          if [ -f "sine_wave.wav" ]; then
            echo "✅ WAV file generated successfully"
            ls -la *.wav
          fi
        else
          echo "Skipping audio tests on Windows (would require audio device setup)"
        fi

    - name: Upload Build Artifacts (CI)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: synth-ci-${{ matrix.os }}-${{ matrix.c_compiler }}
        path: |
          ${{ steps.strings.outputs.build-output-dir }}/bin/
          ${{ steps.strings.outputs.build-output-dir }}/${{ matrix.build_type }}/bin/
          *.wav
        retention-days: 7

    - name: Upload the plugins (Windows VST3 and CLAP)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: obs-plugins-windows-x64
        path: ${{ steps.strings.outputs.build-output-dir }}/plugins/
        retention-days: 14
